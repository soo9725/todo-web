<div style="margin:12px 4px 10px 4px;font-size:15px;color:#3c3c43">‘보고서 초안’을 다시 할 날짜와 시간을 골라요.</div>

<div style="padding:8px 4px 0 4px;font-size:12px;color:#6b6b70;line-height:1.5">복구하면 취소선이 없어지고 고른 날짜의 예정으로 돌아가요. 날짜는 오늘이나 그 뒤로만 고를 수 있어요.</div>
